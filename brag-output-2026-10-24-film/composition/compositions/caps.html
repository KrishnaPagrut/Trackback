    <div id="cap2" class="clip cap" data-start="5.39" data-duration="3.12"><div class="cap-wrap"><div id="cap2-in" class="cap-in">We're reviving it for the numbers inside a company.</div></div></div>

    <div id="cap7" class="clip cap" data-start="17.2" data-duration="2.79"><div class="cap-wrap"><div id="cap7-in" class="cap-in">Finance is two AI agents, an analyst, Maya,</div></div></div>

    <div id="cap11" class="clip cap" data-start="26.59" data-duration="3.45"><div class="cap-wrap"><div id="cap11-in" class="cap-in">The Close Accountant closes the quarter on top of it:</div></div></div>

    <div id="cap21" class="clip cap" data-start="52.36" data-duration="1.3"><div class="cap-wrap"><div id="cap21-in" class="cap-in">First job:</div></div></div>

    <div id="cap36" class="clip cap" data-start="86.6" data-duration="2.79"><div class="cap-wrap"><div id="cap36-in" class="cap-in">“Your certificate rests on net leverage, now 3.03,</div></div></div>
