# Trackback answer key, iteration 2 (SPEC_ITERATION_2 section 13.1): rules about what things rest on, resolved against whatever
# artifacts the agents actually produced, by metric tag, period and stated conclusions. Ground truth comes from the generator's
# own model of the world (world.py: which source rows feed which true quantities), never from Trackback's recorded edges.
# The iteration-1 key (answer_key.yaml, frozen) stays as the per-artifact reference for the deterministic engine.
